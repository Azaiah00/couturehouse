<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Couture House forms</title>
  </head>
  <body>
    <form name="project-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-inquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="business" />
      <input type="url" name="website" />
      <input type="text" name="services" />
      <select name="timeline"><option value="">Select timing</option></select>
      <textarea name="details"></textarea>
      <input type="checkbox" name="privacy-consent" />
      <input type="text" name="subject" />
    </form>

<form name="salon-website-review" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="salon-website-review" />
<input name="bot-field" type="text" />
<input name="name" type="text" />
<input name="email" type="email" />
<input name="business" type="text" />
<input name="instagram" type="text" />
<input name="website" type="text" />
<input name="location" type="text" />
<input name="business_type" type="text" />
<input name="primary_goal" type="text" />
<input name="frustration" type="text" />
<input name="privacy_consent" type="text" />
<input name="public_teardown_permission" type="text" />
<input name="subject" type="text" />
<input name="traffic_source" type="text" />
<input name="traffic_medium" type="text" />
<input name="campaign" type="text" />
<input name="content" type="text" />
</form>
</body>
</html>
