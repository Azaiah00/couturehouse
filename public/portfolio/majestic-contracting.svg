<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Majestic Contracting</title>
  <desc id="desc">Design, build and renovate brand title card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset=".55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="72%">
      <stop offset="0" stop-color="#fde68a" stop-opacity=".65"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
