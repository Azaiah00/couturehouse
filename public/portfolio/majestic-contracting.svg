  <text x="102" y="600" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="800" letter-spacing="-7">CONTRACTING</text>
  <line x1="110" y1="665" x2="870" y2="665" stroke="#fde047" stroke-width="8"/>
  <text x="110" y="738" fill="#fff" fill-opacity=".78" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" letter-spacing="9">DESIGN · BUILD · RENOVATE</text>
