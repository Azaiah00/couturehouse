[build]
command = "npm run build:netlify"
publish = "dist"

[build.environment]
NODE_VERSION = "22.13.0"
NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/brand/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/portfolio/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/work/magic-coils/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/work/photo-revival/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/work/partnership/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/audio/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/work/"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
Netlify-CDN-Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/work/index.html"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
Netlify-CDN-Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
from = "/for-brands"
to = "/services/"
status = 301

[[redirects]]
from = "/for-brands/"
to = "/services/"
status = 301
